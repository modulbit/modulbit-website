---
name: Build & Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest # has Node.js + Docker CLI
      options: --privileged
    services:
      docker:
        image: docker:dind
        options: --privileged
    env:
      DOCKER_HOST: tcp://docker:2375 # point CLI at the DinD sidecar
    permissions:
      contents: read
      packages: write
    steps:
      - name: Wait for Docker daemon
        run: |
          until docker info > /dev/null 2>&1; do
            echo "Waiting for daemon..."
            sleep 2
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Forgejo Container Registry
        run: |
          docker login git.modulbit.eu \
            --username smoliicek \
            --password ${{ secrets.REGISTRY_TOKEN }}

      - name: Build & Push image
        env:
          REPO: ${{ github.repository }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_BASE="git.modulbit.eu/$(echo "${REPO}" | tr '[:upper:]' '[:lower:]')"

          docker build \
            -t "${IMAGE_BASE}:latest" \
            -t "${IMAGE_BASE}:sha-${SHORT_SHA}" \
            .

          docker push "${IMAGE_BASE}:latest"
          docker push "${IMAGE_BASE}:sha-${SHORT_SHA}"
